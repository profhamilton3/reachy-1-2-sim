services:
  reachy-sim:
    build:
      context: .
      dockerfile: Dockerfile
    image: reachy-1-2-sim:latest
    container_name: reachy-1-2-sim
    platform: linux/amd64
    ports:
      - "127.0.0.1:8888:8888"    # JupyterLab
      - "127.0.0.1:6080:6080"    # noVNC → RViz2
      - "127.0.0.1:50051:50051"  # Reachy SDK gRPC (connect via ReachySDK(host='localhost'))
      - "127.0.0.1:8080:8080"     # Stereo camera browser preview
      # To allow access from other machines (e.g. remote notebook use), change 127.0.0.1
      # to 0.0.0.0 and ensure the host firewall restricts access appropriately.
    volumes:
      - ./notebooks:/notebooks   # Hot-reload notebooks without rebuild
      # Scenes are also COPYed into the image at build time, but bind-mounting
      # them means a new or edited scene shows up in RViz without a rebuild —
      # otherwise the native MuJoCo server renders the new scene while the
      # container still has only the baked-in set and RViz draws nothing.
      - ./scenes:/opt/scenes
      # Same reasoning for the Python library and the demo scripts: both are
      # COPYed in at build time, so without these mounts the container silently
      # runs whatever src/ looked like when the image was last built.  That is
      # how a notebook calling newly added SceneModel methods (grid_cells,
      # cell_center) hit AttributeError against an image that predated them.
      - ./src:/opt/src
      - ./scripts:/opt/scripts
      # And the camera page, for the same reason.  It was NOT mounted while the
      # other four were, so `docker compose restart` silently kept serving the
      # baked-in page: a fix to the scene-control panel's heartbeat handling
      # never reached the browser, the sim dropped the panel's socket after 6 s,
      # and every click after that went nowhere with the status bar still
      # reading "connected".
      - ./web:/opt/web
      # The robot MJCF, read-only.  `model_sha256` MEANS this file: the panel
      # hashes it to say which robot an episode was recorded against, even
      # though it never loads it (it talks to the simulator over the SDK
      # bridge and has no model of its own).  Without the file the hash is
      # empty, which is the DEGENERATE identity the reuse gate refuses to
      # answer about and `query_compatible_trials` raises on — so every
      # episode recorded is unusable as evidence and retrieval can never fire,
      # silently, with the panel otherwise working perfectly.
      #
      # Read-only because nothing in the container may edit the robot: a
      # changed model is a different world, and this is the file that says so.
      - ./native_mujoco/model:/opt/native_mujoco/model:ro
      # The experience stores.  Without this they live in the container's
      # writable layer and a rebuild silently discards every episode the panel
      # ever recorded — which is the one thing the memory epic exists to keep.
      # `runs/` is gitignored, so nothing here reaches a commit.
      - ./runs:/opt/runs
    environment:
      - DISPLAY=:1
      # Backend selector (overridable from the shell):
      #   kinematic     (default) — reliable, self-contained; the demo animates
      #                 objects following the gripper in RViz.  `docker compose up`
      #                 works out of the box with no host process.
      #   mujoco-remote — real physics; bridges to the native macOS MuJoCo server.
      #                 Use scripts/start_sim.sh, which starts that server and
      #                 exports REACHY_SIM_BACKEND=mujoco-remote before compose up.
      - REACHY_SIM_BACKEND=${REACHY_SIM_BACKEND:-kinematic}
      - REACHY_SIM_MUJOCO_URL=ws://host.docker.internal:8765
      - REACHY_SIM_ALLOW_FIXTURE_FALLBACK=true
      # Scene the noVNC/RViz view renders — set by scripts/start_sim.sh so it
      # matches the launched physics scene.  Defaults to the pick-and-place table.
      - REACHY_SIM_SCENE_FILE=${REACHY_SIM_SCENE_FILE:-/opt/scenes/tabletop_demo.yaml}
      # Command panel: does pressing Confirm move the arm, or only produce a
      # plan?  Off unless asked for, because turning it on changes what a
      # button on a page does to the world, and that should be a deliberate
      # act by whoever runs the container rather than something that arrives
      # with a page upgrade.  Even with it on, the executor still refuses
      # unless the simulator advertises the execution lease.
      - REACHY_PANEL_EXECUTOR=${REACHY_PANEL_EXECUTOR:-0}
      # Episode recording (#88).  On by default: recording observes, it does
      # not act, and the episodes it would have missed are the ones nobody can
      # get back.  Set to 0 to switch it off.
      - REACHY_PANEL_EPISODES=${REACHY_PANEL_EPISODES:-1}
      - REACHY_PANEL_EPISODE_DB=${REACHY_PANEL_EPISODE_DB:-}
      - REACHY_PANEL_EPISODE_KEEP=${REACHY_PANEL_EPISODE_KEEP:-}
      # Promoted-recipe retrieval (#90).  On by default because with nothing
      # promoted it changes nothing: it looks, finds none, and the ability
      # flies the route it always flies.  Reads promoted_recipes.db, NOT the
      # live episode log — every row in that one is live-interactive and
      # excluded from reuse by construction.
      - REACHY_PANEL_RECIPES=${REACHY_PANEL_RECIPES:-1}
      - REACHY_PANEL_RECIPE_DB=${REACHY_PANEL_RECIPE_DB:-}
      # Language adapter (#92).  OFF unless asked for, and off again if no key
      # is present: it sends the operator's sentence to a cloud model, which is
      # a deliberate act by whoever runs the container and not something that
      # should arrive with an image upgrade.
      #
      # The key is passed THROUGH from the host shell and is not written into
      # this file.  It is still visible to `docker inspect` on this machine,
      # which is the normal cost of an environment variable — if that matters
      # here, use a Docker secret instead.
      - REACHY_PANEL_LANGUAGE=${REACHY_PANEL_LANGUAGE:-0}
      - REACHY_PANEL_LANGUAGE_MODEL=${REACHY_PANEL_LANGUAGE_MODEL:-}
      - REACHY_PANEL_LANGUAGE_MIN_CONFIDENCE=${REACHY_PANEL_LANGUAGE_MIN_CONFIDENCE:-}
      - REACHY_PANEL_LANGUAGE_TIMEOUT_S=${REACHY_PANEL_LANGUAGE_TIMEOUT_S:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    stdin_open: true
    tty: true
    restart: unless-stopped
