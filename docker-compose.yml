services:
  reachy-sim:
    build:
      context: .
      dockerfile: Dockerfile
    image: reachy-1-2-sim:latest
    container_name: reachy-1-2-sim
    platform: linux/amd64
    ports:
      - "127.0.0.1:8888:8888"    # JupyterLab
      - "127.0.0.1:6080:6080"    # noVNC → RViz2
      - "127.0.0.1:50051:50051"  # Reachy SDK gRPC (connect via ReachySDK(host='localhost'))
      - "127.0.0.1:8080:8080"     # Stereo camera browser preview
      # To allow access from other machines (e.g. remote notebook use), change 127.0.0.1
      # to 0.0.0.0 and ensure the host firewall restricts access appropriately.
    volumes:
      - ./notebooks:/notebooks   # Hot-reload notebooks without rebuild
      # Scenes are also COPYed into the image at build time, but bind-mounting
      # them means a new or edited scene shows up in RViz without a rebuild —
      # otherwise the native MuJoCo server renders the new scene while the
      # container still has only the baked-in set and RViz draws nothing.
      - ./scenes:/opt/scenes
      # Same reasoning for the Python library and the demo scripts: both are
      # COPYed in at build time, so without these mounts the container silently
      # runs whatever src/ looked like when the image was last built.  That is
      # how a notebook calling newly added SceneModel methods (grid_cells,
      # cell_center) hit AttributeError against an image that predated them.
      - ./src:/opt/src
      - ./scripts:/opt/scripts
      # And the camera page, for the same reason.  It was NOT mounted while the
      # other four were, so `docker compose restart` silently kept serving the
      # baked-in page: a fix to the scene-control panel's heartbeat handling
      # never reached the browser, the sim dropped the panel's socket after 6 s,
      # and every click after that went nowhere with the status bar still
      # reading "connected".
      - ./web:/opt/web
    environment:
      - DISPLAY=:1
      # Backend selector (overridable from the shell):
      #   kinematic     (default) — reliable, self-contained; the demo animates
      #                 objects following the gripper in RViz.  `docker compose up`
      #                 works out of the box with no host process.
      #   mujoco-remote — real physics; bridges to the native macOS MuJoCo server.
      #                 Use scripts/start_sim.sh, which starts that server and
      #                 exports REACHY_SIM_BACKEND=mujoco-remote before compose up.
      - REACHY_SIM_BACKEND=${REACHY_SIM_BACKEND:-kinematic}
      - REACHY_SIM_MUJOCO_URL=ws://host.docker.internal:8765
      - REACHY_SIM_ALLOW_FIXTURE_FALLBACK=true
      # Scene the noVNC/RViz view renders — set by scripts/start_sim.sh so it
      # matches the launched physics scene.  Defaults to the pick-and-place table.
      - REACHY_SIM_SCENE_FILE=${REACHY_SIM_SCENE_FILE:-/opt/scenes/tabletop_demo.yaml}
      # Command panel: does pressing Confirm move the arm, or only produce a
      # plan?  Off unless asked for, because turning it on changes what a
      # button on a page does to the world, and that should be a deliberate
      # act by whoever runs the container rather than something that arrives
      # with a page upgrade.  Even with it on, the executor still refuses
      # unless the simulator advertises the execution lease.
      - REACHY_PANEL_EXECUTOR=${REACHY_PANEL_EXECUTOR:-0}
    stdin_open: true
    tty: true
    restart: unless-stopped
