services:
  reachy-sim:
    build:
      context: .
      dockerfile: Dockerfile
    image: reachy-1-2-sim:latest
    container_name: reachy-1-2-sim
    platform: linux/amd64
    ports:
      - "127.0.0.1:8888:8888"    # JupyterLab
      - "127.0.0.1:6080:6080"    # noVNC → RViz2
      - "127.0.0.1:50051:50051"  # Reachy SDK gRPC (connect via ReachySDK(host='localhost'))
      - "127.0.0.1:8080:8080"     # Stereo camera browser preview
      # To allow access from other machines (e.g. remote notebook use), change 127.0.0.1
      # to 0.0.0.0 and ensure the host firewall restricts access appropriately.
    volumes:
      - ./notebooks:/notebooks   # Hot-reload notebooks without rebuild
    environment:
      - DISPLAY=:1
    stdin_open: true
    tty: true
    restart: unless-stopped
