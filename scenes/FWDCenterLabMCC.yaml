  #   pose set exists here; see its header for the retirement condition.
  #
  # PLACEMENT
  #   Both objects sit on reachable cells.  The 65 cm shoulder sphere puts
  #   cell_r3c1 and cell_r3c2 out of the right arm's range (confirmed
