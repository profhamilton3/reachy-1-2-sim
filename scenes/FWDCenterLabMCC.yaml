  # ── Manipulation objects ───────────────────────────────────────────────────
  # Added 2026-08-31.  The scene shipped deliberately empty ("Manipulation
  # objects are added in a later slice once the geometry and physics are
  # verified"); the geometry is now verified and the camera is calibrated
  # (PR #30), so renders of these objects come through the real 61.1 deg lens.
  #
  # DIMENSIONS, PHYSICS AND semantic_class ARE COPIED VERBATIM FROM
  # scenes/tabletop_demo.yaml, deliberately.  Two reasons:
  #
  #   1. Siva's Coral classifier (IITG-Reachy-Project/scripts/reachy_classifier.tflite,
  #      labels: empty / cube / cylinder) was trained on photos of the real cube
  #      and cylinder.  Keeping the sim objects identical makes a sim render
  #      directly comparable to what that model already learned, so it can be
  #      evaluated against sim frames without retraining anything.
  #   2. tabletop_demo's table surface is at z = 0.7400 — exactly this board's
