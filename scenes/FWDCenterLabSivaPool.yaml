schema_version: "1.0"
extends: FWDCenterLabSiva.yaml
name: FWDCenterLabSivaPool

# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS SCENE IS FOR
#
# A POOL of objects Reachy can be given to interact with, placed onto the board
# from a notebook while the simulation runs.  notebooks/place_objects.ipynb
# drives it.  Pick-and-place work uses FWDCenterLabSiva.yaml, which keeps its
# four manipulables on the grid; this scene is the one where the board starts
# empty and the caller decides what goes on it.
#
# Thirty placeable objects: the four inherited manipulables (in the MCC colours),
# ten grey spare slots (five boxes, five cylinders, all one size), and sixteen of
# Willis's printed parts (#212, below).
# Spares exist because MuJoCo freezes nbody/njnt/ngeom at compile time — there
# is no add_body(), so having MORE objects available than a scene declares means
# declaring them up front and moving them.  reshape() then makes one slot stand
# in for different objects across a run without a recompile.
# ─────────────────────────────────────────────────────────────────────────────

description: >-
  FWDCenterLabSiva plus a pool of spare manipulables parked on the floor, for
  putting objects on the board while the simulation is running.  Geometry,
  calibration, grid, reachability and the grid and reachability are all
  inherited; this file adds slots and the sixteen printed PART objects and
  restores the four named objects' colours.

# ─────────────────────────────────────────────────────────────────────────────
# WHY A CHILD SCENE AND NOT FWDCenterLabSiva ITSELF
#
# The detector handoff set in IITG-Reachy-Project/data/annotations/ was rendered
# from FWDCenterLabSiva at seed 2026, and its README promises the set can be
# regenerated.  Adding bodies to that scene changes what the renderer produces
# for a given seed and quietly breaks that promise.  The pool lives one level
# down, so the dataset scene stays byte-for-byte what it was.
#
# WHY THE SLOTS EXIST AT ALL
#
# MuJoCo freezes nbody/njnt/ngeom at compile time — there is no add_body(), and
# server.py still (correctly) refuses a runtime scene_load because it cannot
# swap the model atomically.  So "put an object on the table" has to mean "move
# one that already exists".  These are the ones that exist.
#
# WHY THEY SIT ON THE FLOOR RATHER THAN HIDDEN BELOW IT
#
# The floor is an infinite plane, so a body parked at z = -0.5 is penetrating it
# and gets ejected — measured, one returned to z = +0.005 carrying 2.4 m/s after
# 2000 steps.  On the floor they rest quietly, they render (so the pool is
# visible rather than magic), and at y = ±0.75 they are far outside the right
# arm's 0.609 m reach, so nothing can disturb them by accident.
#
# SIZES ARE THE LAB'S TIC-TAC-TOE PIECES (#201).  Siva measured them on
# 2026-10-19, with photos: the cube is 2 in = 50.8 mm on a side; the cylinder
# is 1.8 in = 45.7 mm across and 2.8 in = 71.1 mm tall.  All five boxes and
# all five cylinders take those sizes (#193 made each set one size; the 40 mm
# boxes and 40 x 80 mm cylinders were a stand-in "until Siva measures").
# Provenance: docs/scene-object-dimensions.md.  Mass and friction are
# unchanged: they were not measured.  The named manipulables (red_cube,
# blue_cylinder, soda_can, foam_block) keep their own confirmed dimensions.
# placement.py's reshape() sets size, colour and mass on the LIVE model, so a
# slot becomes whatever the run needs without a recompile.
#
# reshape() — not a bare geom_size write — is the supported way to do that.
# geom_rbound is computed by the compiler and is NOT recomputed when geom_size
# changes (mj_setConst does not fix it either), so growing a geom without
# updating rbound leaves the broadphase culling the pair and contacts silently
# stop being generated.  reshape() writes both.
# ─────────────────────────────────────────────────────────────────────────────

