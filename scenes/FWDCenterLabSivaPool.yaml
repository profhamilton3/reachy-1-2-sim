  # ───────────────────────────────────────────────────────────────────────────
  # WILLIS'S PRINTED PARTS (#212, owner decisions 2026-11-27)
  #
  # Sixteen bodies, two of each of eight designs.  PART<S><H><F>:
  #   S  1 = block, 2 = cylinder
  #   H  1 = short (25.4 mm), 2 = tall (69.85 mm)
  #   F  0 = solid, 1 = 25.4 mm through hole, vertical
  # Footprint: block 49.21 mm square, cylinder radius 24.606 mm.
  #
  # BUILT FROM PRIMITIVES.  The printer files are not committed (public repo, no
  # permission yet), and a mesh would collide as its convex hull, which fills
  # the hole.  Holed parts are `kind: compound`:
  #   block     four walls, so THE BORE IS SQUARE here (25.4 mm), not round
  #   cylinder  16 boxes, a 16-sided ring: flats at r = 12.7 and 24.606 mm,
  #             outer corners 0.48 mm proud
  #
  # DO NOT "TIDY" THE TWO HEIGHTS.  In a holed part only every other ring
  # segment (or the two long walls) reaches the end faces; the others stop
  # 0.1 mm short at each end.  Those that do reach span the whole footprint, so
  # it stands and tips as a flat face would.  With all sixteen on the floor,
  # the four parked rings took the physics step from 0.14 ms to 1.7 ms of its
  # 2 ms budget (the no-slip pass grows with the square of the contacts on one
  # body).  tests/unit/test_part_set_scene.py::TestEndFaces holds this.
  #
  # COLOUR FOLLOWS THE FAMILY (shape x height), NEVER THE HOLE, so the hole has
  # to be perceived.  FWDCenterLabSivaPoolBlack and ...Random repaint these by
  # the `part-set` tag or by id.
  #
  # MASS IS SYNTHETIC, NOT MEASURED.  Provenance: docs/scene-object-dimensions.md.
  #
  # Parked like the pool slots: blocks at y = +1.15, cylinders at y = -1.15.
  # reshape() refuses the holed ones; use them as they are.
