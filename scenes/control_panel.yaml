schema_version: "1.0"
name: control-panel-practice
# Interactive control console for Reachy 1.2 to practice on (both arms).
#
# Layout (world / pedestal frame; shoulders at z≈1.0, right at y=-0.19, left at
# y=+0.19, torso front at x≈0):
#   * console front edge at x = 0.50 m (≈0.5 m from the torso front — a realistic
#     lab distance).
#   * a FLAT TOP ledge (z≈0.76) with a row of 4 colored spring BUTTONS.
#   * a SLANTED FACE (~34° back) with 2 LEVERS, 2 SWITCHES (grippable handles)
#     and 2 more BUTTONS.
# Controls span y ≈ -0.19 → +0.19 so the right gripper works the y<0 side and the
# left gripper the y>0 side.  Each control has its own color and lights up when ON.
#
# Interactivity is driven by native_mujoco/interactive.py (buttons toggle on a
# full press; switches/levers are bistable hinges that snap to on/off).
frame_id: pedestal
seed: 7
description: >-
  Reachy 1.2 practice console: colored spring buttons on a flat top and
  grippable levers/switches plus buttons on a slanted face, all within
  two-arm reach.  Buttons latch on/off when pressed; switches/levers snap.

world:
  gravity: [0.0, 0.0, -9.81]
  background_rgba: [0.08, 0.10, 0.14, 1.0]
  floor:
    enabled: true
    z: 0.0
    size: [4.0, 4.0]
    material:
      rgba: [0.35, 0.35, 0.35, 1.0]
    friction: [0.8, 0.01, 0.001]
  lights:
    - id: key_light
      kind: directional
      pose:
        position: [1.0, -1.0, 2.5]
        rpy: [0.0, 0.65, 2.35]
      color: [1.0, 0.96, 0.90, 1.0]
      intensity: 1.2
      cast_shadows: true

cameras:
  left:
    width: 640
    height: 480
    fovy_radians: 0.78
    near: 0.02
    far: 10.0
    jpeg_quality: 85
    fps: 15
  right:
    width: 640
    height: 480
    fovy_radians: 0.78
    near: 0.02
    far: 10.0
    jpeg_quality: 85
    fps: 15

objects:
  # ── Console structure (static fixtures) ──────────────────────────────────
  - id: console_base
    geometry:
      kind: box
      size: [0.34, 0.72, 0.72]
    pose:
      position: [0.67, 0.0, 0.36]
    material:
      rgba: [0.20, 0.22, 0.28, 1.0]
    physics:
      dynamic: false
      # Non-colliding: the console must not shove its own mounted controls
      # around.  The arm avoids the console via scene-awareness path planning.
      collision: false
    semantic_class: furniture.console
    tags: [panel, fixture]

  - id: console_ledge         # flat top surface (holds the button row)
    geometry:
      kind: box
      size: [0.16, 0.72, 0.04]
    pose:
      position: [0.56, 0.0, 0.74]
    material:
      rgba: [0.26, 0.28, 0.34, 1.0]
    physics:
      dynamic: false
      # Non-colliding: the console must not shove its own mounted controls
      # around.  The arm avoids the console via scene-awareness path planning.
      collision: false
    semantic_class: furniture.console
    tags: [panel, fixture]

  - id: console_slant         # slanted face (holds levers/switches/buttons)
    geometry:
      kind: box
      size: [0.34, 0.72, 0.04]
    pose:
      position: [0.66, 0.0, 1.01]
      rpy: [0.0, -0.60, 0.0]
    material:
      rgba: [0.24, 0.26, 0.32, 1.0]
    physics:
      dynamic: false
      # Non-colliding: the console must not shove its own mounted controls
      # around.  The arm avoids the console via scene-awareness path planning.
      collision: false
    semantic_class: furniture.console
    tags: [panel, fixture]

  # ── Flat-top spring BUTTONS (press straight down) ────────────────────────
  - id: btn_red
    geometry: {kind: cylinder, radius: 0.030, length: 0.028}
    pose: {position: [0.55, -0.19, 0.775]}
    material: {rgba: [0.85, 0.10, 0.10, 1.0]}
    physics: {collision: true, friction: [1.0, 0.02, 0.001]}
    articulation: {joint: slide, axis: [0, 0, 1], range: [-0.012, 0.0], stiffness: 250, damping: 4, springref: 0}
    interactive: {type: button, on_threshold: -0.006, off_threshold: -0.002, lit_rgba: [1.0, 0.45, 0.45, 1.0]}
    semantic_class: control.button
    tags: [control]

  - id: btn_green
    geometry: {kind: cylinder, radius: 0.030, length: 0.028}
    pose: {position: [0.55, -0.07, 0.775]}
    material: {rgba: [0.10, 0.65, 0.15, 1.0]}
    physics: {collision: true, friction: [1.0, 0.02, 0.001]}
    articulation: {joint: slide, axis: [0, 0, 1], range: [-0.012, 0.0], stiffness: 250, damping: 4, springref: 0}
    interactive: {type: button, on_threshold: -0.006, off_threshold: -0.002, lit_rgba: [0.5, 1.0, 0.5, 1.0]}
    semantic_class: control.button
    tags: [control]

  - id: btn_blue
    geometry: {kind: cylinder, radius: 0.030, length: 0.028}
    pose: {position: [0.55, 0.07, 0.775]}
    material: {rgba: [0.10, 0.30, 0.90, 1.0]}
    physics: {collision: true, friction: [1.0, 0.02, 0.001]}
    articulation: {joint: slide, axis: [0, 0, 1], range: [-0.012, 0.0], stiffness: 250, damping: 4, springref: 0}
    interactive: {type: button, on_threshold: -0.006, off_threshold: -0.002, lit_rgba: [0.5, 0.7, 1.0, 1.0]}
    semantic_class: control.button
    tags: [control]

  - id: btn_yellow
    geometry: {kind: cylinder, radius: 0.030, length: 0.028}
    pose: {position: [0.55, 0.19, 0.775]}
    material: {rgba: [0.88, 0.80, 0.10, 1.0]}
    physics: {collision: true, friction: [1.0, 0.02, 0.001]}
    articulation: {joint: slide, axis: [0, 0, 1], range: [-0.012, 0.0], stiffness: 250, damping: 4, springref: 0}
    interactive: {type: button, on_threshold: -0.006, off_threshold: -0.002, lit_rgba: [1.0, 1.0, 0.5, 1.0]}
    semantic_class: control.button
    tags: [control]

  # ── Slanted-face LEVERS (hinge about y, tall grippable handle, bistable) ──
  - id: lever_r
    geometry: {kind: box, size: [0.028, 0.028, 0.13]}
    pose: {position: [0.57, -0.19, 0.925]}
    material: {rgba: [1.0, 0.55, 0.0, 1.0]}
    physics: {collision: true, mass: 0.08, friction: [1.0, 0.02, 0.001]}
    articulation: {joint: hinge, axis: [0, 1, 0], range: [-0.7, 0.7], damping: 1.2, armature: 0.01, handle_offset: [0, 0, 0.065]}
    interactive: {type: lever, on_threshold: 0.12, bistable: true, lit_rgba: [1.0, 0.75, 0.4, 1.0]}
    semantic_class: control.lever
    tags: [control]

  - id: lever_l
    geometry: {kind: box, size: [0.028, 0.028, 0.13]}
    pose: {position: [0.57, 0.19, 0.925]}
    material: {rgba: [0.55, 0.20, 0.80, 1.0]}
    physics: {collision: true, mass: 0.08, friction: [1.0, 0.02, 0.001]}
    articulation: {joint: hinge, axis: [0, 1, 0], range: [-0.7, 0.7], damping: 1.2, armature: 0.01, handle_offset: [0, 0, 0.065]}
    interactive: {type: lever, on_threshold: 0.12, bistable: true, lit_rgba: [0.8, 0.6, 1.0, 1.0]}
    semantic_class: control.lever
    tags: [control]

  # ── Slanted-face SWITCHES (hinge about y, short handle, bistable) ─────────
  - id: switch_r
    geometry: {kind: box, size: [0.026, 0.026, 0.075]}
    pose: {position: [0.60, -0.07, 0.965]}
    material: {rgba: [0.0, 0.70, 0.80, 1.0]}
    physics: {collision: true, mass: 0.05, friction: [1.0, 0.02, 0.001]}
    articulation: {joint: hinge, axis: [0, 1, 0], range: [-0.5, 0.5], damping: 1.0, armature: 0.008, handle_offset: [0, 0, 0.038]}
    interactive: {type: switch, on_threshold: 0.0, bistable: true, lit_rgba: [0.5, 1.0, 1.0, 1.0]}
    semantic_class: control.switch
    tags: [control]

  - id: switch_l
    geometry: {kind: box, size: [0.026, 0.026, 0.075]}
    pose: {position: [0.60, 0.07, 0.965]}
    material: {rgba: [0.85, 0.10, 0.70, 1.0]}
    physics: {collision: true, mass: 0.05, friction: [1.0, 0.02, 0.001]}
    articulation: {joint: hinge, axis: [0, 1, 0], range: [-0.5, 0.5], damping: 1.0, armature: 0.008, handle_offset: [0, 0, 0.038]}
    interactive: {type: switch, on_threshold: 0.0, bistable: true, lit_rgba: [1.0, 0.5, 0.9, 1.0]}
    semantic_class: control.switch
    tags: [control]

  # ── Slanted-face BUTTONS (press along the slant normal) ───────────────────
  - id: btn_white
    geometry: {kind: cylinder, radius: 0.030, length: 0.028}
    pose: {position: [0.635, -0.12, 1.02], rpy: [0.0, -0.60, 0.0]}
    material: {rgba: [0.90, 0.90, 0.90, 1.0]}
    physics: {collision: true, friction: [1.0, 0.02, 0.001]}
    articulation: {joint: slide, axis: [0, 0, 1], range: [-0.012, 0.0], stiffness: 250, damping: 4, springref: 0}
    interactive: {type: button, on_threshold: -0.006, off_threshold: -0.002, lit_rgba: [1.0, 1.0, 0.8, 1.0]}
    semantic_class: control.button
    tags: [control]

  - id: btn_pink
    geometry: {kind: cylinder, radius: 0.030, length: 0.028}
    pose: {position: [0.635, 0.12, 1.02], rpy: [0.0, -0.60, 0.0]}
    material: {rgba: [1.0, 0.50, 0.60, 1.0]}
    physics: {collision: true, friction: [1.0, 0.02, 0.001]}
    articulation: {joint: slide, axis: [0, 0, 1], range: [-0.012, 0.0], stiffness: 250, damping: 4, springref: 0}
    interactive: {type: button, on_threshold: -0.006, off_threshold: -0.002, lit_rgba: [1.0, 0.75, 0.8, 1.0]}
    semantic_class: control.button
    tags: [control]
