recipe_id: control_panel_baseline_v1
recipe_version: 1
task_type: operate_control
arm: right
source: baseline
parent_recipe_id: ""

# bounded_parameters: every tunable scalar with declared units and search bounds.
# The search engine (PR 8.5) will vary values within [min, max]; baseline defaults
# are the known-good constants from the existing demo_control_panel.py logic.
bounded_parameters:
  # --- Phase step counts -------------------------------------------------------
  guard_steps:
    value: 30
    min: 10
    max: 120
    unit: steps
    description: hold steps for the guard/retracted pose before each reach
  standoff_steps:
    value: 50
    min: 20
    max: 200
    unit: steps
    description: interpolation steps from guard to standoff position
  approach_steps:
    value: 30
    min: 15
    max: 120
    unit: steps
    description: interpolation steps from standoff to contact-ready position
  press_steps:
    value: 25
    min: 10
    max: 100
    unit: steps
    description: steps to hold at the deepest contact position
  settle_steps:
    value: 20
    min: 5
    max: 80
    unit: steps
    description: hold steps after contact to let physics settle
  retract_steps:
    value: 30
    min: 15
    max: 120
    unit: steps
    description: interpolation steps from contact back to standoff

  # --- Standoff pose joint targets ---------------------------------------------
  # From demo_control_panel.py GUARD_R + reach-forward kinematics.
  # The arm swings from the guard pose (shoulder +30°) forward to approach the
  # console.  These are the baseline joint targets for the standoff position
  # (~10 cm in front of a typical upper-panel control).
  standoff_shoulder_pitch_deg:
    value: -12.0
    min: -35.0
    max: 5.0
    unit: deg
    description: r_shoulder_pitch at standoff (negative = arm swings forward)
  standoff_shoulder_roll_deg:
    value: -5.0
    min: -20.0
    max: 5.0
    unit: deg
  standoff_arm_yaw_deg:
    value: 5.0
    min: -15.0
    max: 20.0
    unit: deg
  standoff_elbow_pitch_deg:
    value: -88.0
    min: -125.0
    max: -50.0
    unit: deg
    description: r_elbow_pitch at standoff (negative = bent; extends forearm forward)
  standoff_wrist_pitch_deg:
    value: 10.0
    min: -20.0
    max: 35.0
    unit: deg
  standoff_forearm_yaw_deg:
    value: 0.0
    min: -30.0
    max: 30.0
    unit: deg

  # --- Press-phase deltas (applied on top of standoff values) ------------------
  # Positive reach-forward is achieved by pitching the shoulder slightly more
  # negative and deepening the elbow bend.
  press_shoulder_pitch_delta_deg:
    value: -8.0
    min: -20.0
    max: 0.0
    unit: deg
    description: additional shoulder pitch to push the hand into the control
  press_elbow_pitch_delta_deg:
    value: -4.0
    min: -15.0
    max: 0.0
    unit: deg
    description: additional elbow bend during the press phase

joint_limits:
  r_shoulder_pitch: 35.0
  r_shoulder_roll: 20.0
  r_arm_yaw: 20.0
  r_elbow_pitch: 125.0
  r_forearm_yaw: 100.0
  r_wrist_pitch: 45.0
  r_wrist_roll: 45.0

velocity_limits: {}
effort_limits: {}

primitive_sequence:
  # Return arm to the elbow-back guard pose before any reach attempt.
  - primitive: guard
    parameters:
      hold_steps: 30

  # Swing arm forward to a safe standoff position in front of the console.
  - primitive: approach_standoff
    parameters:
      hold_steps: 50
      shoulder_pitch_deg: -12.0
      shoulder_roll_deg: -5.0
      arm_yaw_deg: 5.0
      elbow_pitch_deg: -88.0
      wrist_pitch_deg: 10.0
      forearm_yaw_deg: 0.0

  # Advance the hand from standoff toward the control surface.
  - primitive: approach_control
    parameters:
      hold_steps: 30
      shoulder_pitch_delta_deg: -8.0
      elbow_pitch_delta_deg: -4.0

  # Hold at the deepest contact position (press button or hold sweep point).
  - primitive: press_or_sweep
    parameters:
      hold_steps: 25

  # Hold at contact to allow physics to register the state change.
  - primitive: settle
    parameters:
      hold_steps: 20

  # Pull hand back to standoff position.
  - primitive: retract
    parameters:
      hold_steps: 30

  # Return arm to the guard pose.
  - primitive: return_guard
    parameters:
      hold_steps: 30
