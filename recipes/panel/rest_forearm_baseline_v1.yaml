# Rest the arm on the board: PRESENT -> REST, the hand onto the board's right
# margin from outside the board (LOWER_TO_REST; the October layout, #192).
#
# WHAT MAY BE SEARCHED HERE IS TIME, AND NOTHING ELSE.  Every pose below is a
# measured waypoint and the ORDER is the safety argument — the hand shuts while
# raised, swings out past the board's edge, and only then comes down onto the
# margin.  So the recipe varies `seconds` per waypoint and leaves the geometry
# alone; a recipe that reorders the route, drops a waypoint or loosens a
# tolerance is rejected by `evaluation/panel_routes.check_route_integrity`,
# not scored.
#
# Faster is the interesting direction and the dangerous one: the arm lags its
# goal, and a segment flown too fast finishes short of the waypoint the next
# segment's clearance was measured from.  The waypoint tolerance is what
# catches that, which is exactly why it may not be loosened — a failed trial
# there is evidence about the bound and is kept.
#
# Version 2 (#192): the rail-pocket corridor (PLACE_ROUTE, HOME -> REST) went
# with the August mount; this is the October route.

recipe_id: rest_forearm_baseline_v1
recipe_version: 2
task_type: rest_forearm
arm: right
source: baseline
parent_recipe_id: ""
route: LOWER_TO_REST
route_version: 3   # 2: SWING_1 moved (#74); 3: the October REST (#192)
expected_start_posture: present

bounded_parameters:
  # A multiplier on every waypoint's measured duration.  One knob
  # rather than one per waypoint: the route is flown as a whole and
  # the tracking lag that a faster flight produces is a property of the
  # whole flight.  Below 1.0 is faster than measured, which is allowed
  # and is what the waypoint tolerances exist to catch.
  segment_duration_scale:
    value: 1.0
    min: 0.8
    max: 1.6
    step: 0.2
    unit: ratio
    description: multiplier on each waypoint's measured seconds
  # How long a settle pass is when a waypoint has not converged.  The
  # live route runner re-streams progressively longer passes; this is
  # the first one's length.
  settle_pass_s:
    value: 0.8
    min: 0.4
    max: 2.0
    step: 0.4
    unit: s
    description: length of the first re-stream pass after a short waypoint

joint_limits: {}
velocity_limits: {}
effort_limits: {}

# THE ROUTE.  Generated from `reachy_ai.motion.rig_routes` — the module the
# arm actually flies — and pinned to it by a test.  Editing a name, an order
# or a tolerance here does not change what the robot does; it makes this file
# disagree with the robot, which the integrity check then reports.
primitive_sequence:
  - primitive: waypoint
    parameters:
      name: PRESENT_SHUT
      seconds: 1.5
      tol: 8.0
      guard:
        - r_shoulder_pitch
        - r_shoulder_roll
        - r_arm_yaw
        - r_elbow_pitch
  - primitive: waypoint
    parameters:
      name: REST_OUT
      seconds: 3.0
      tol: 6.0
      guard:
        - r_shoulder_pitch
        - r_shoulder_roll
        - r_arm_yaw
        - r_elbow_pitch
  - primitive: waypoint
    parameters:
      name: REST
      seconds: 3.0
      tol: 6.0
      guard:
        - r_shoulder_pitch
        - r_shoulder_roll
        - r_arm_yaw
        - r_elbow_pitch
