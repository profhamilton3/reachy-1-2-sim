# Stow the arm: PRESENT -> REST.  HOME IS REST in the October layout (#192),
# so the stow is LOWER_TO_REST, the same route as rest_forearm: the hand shuts
# while raised, swings out past the board's edge, and comes onto the board's
# right margin from outside the board.  The search varies segment durations
# and may not touch the order, the poses, the tolerances or the guarded
# joints.
#
# Version 2 (#192): the rail-pocket corridor (STOW_ROUTE, REST -> HOME) went
# with the August mount.

recipe_id: stow_arm_baseline_v1
recipe_version: 2
task_type: stow_arm
arm: right
source: baseline
parent_recipe_id: ""
route: LOWER_TO_REST
route_version: 3   # 2: SWING_1 moved (#74); 3: the October REST (#192)
expected_start_posture: present

bounded_parameters:
  # A multiplier on every waypoint's measured duration.  One knob
  # rather than one per waypoint: the route is flown as a whole and
  # the tracking lag that a faster flight produces is a property of the
  # whole flight.  Below 1.0 is faster than measured, which is allowed
  # and is what the waypoint tolerances exist to catch.
  segment_duration_scale:
    value: 1.0
    min: 0.8
    max: 1.6
    step: 0.2
    unit: ratio
    description: multiplier on each waypoint's measured seconds
  # How long a settle pass is when a waypoint has not converged.  The
  # live route runner re-streams progressively longer passes; this is
  # the first one's length.
  settle_pass_s:
    value: 0.8
    min: 0.4
    max: 2.0
    step: 0.4
    unit: s
    description: length of the first re-stream pass after a short waypoint

joint_limits: {}
velocity_limits: {}
effort_limits: {}

# THE ROUTE.  Generated from `reachy_ai.motion.rig_routes` — the module the
# arm actually flies — and pinned to it by a test.  Editing a name, an order
# or a tolerance here does not change what the robot does; it makes this file
# disagree with the robot, which the integrity check then reports.
primitive_sequence:
  - primitive: waypoint
    parameters:
      name: PRESENT_SHUT
      seconds: 1.5
      tol: 8.0
      guard:
        - r_shoulder_pitch
        - r_shoulder_roll
        - r_arm_yaw
        - r_elbow_pitch
  - primitive: waypoint
    parameters:
      name: REST_OUT
      seconds: 3.0
      tol: 6.0
      guard:
        - r_shoulder_pitch
        - r_shoulder_roll
        - r_arm_yaw
        - r_elbow_pitch
  - primitive: waypoint
    parameters:
      name: REST
      seconds: 3.0
      tol: 6.0
      guard:
        - r_shoulder_pitch
        - r_shoulder_roll
        - r_arm_yaw
        - r_elbow_pitch
