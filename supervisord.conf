[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ── 1. Virtual framebuffer ────────────────────────────────────────────────────
[program:xvfb]
command=Xvfb :1 -screen 0 1280x900x24 -ac
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.log

; ── 2. Window manager ─────────────────────────────────────────────────────────
[program:fluxbox]
command=fluxbox
environment=DISPLAY=":1"
autorestart=true
priority=20
startretries=5
stdout_logfile=/var/log/supervisor/fluxbox.log
stderr_logfile=/var/log/supervisor/fluxbox.log

; ── 3. VNC server ─────────────────────────────────────────────────────────────
[program:x11vnc]
command=x11vnc -display :1 -nopw -forever -shared -rfbport 5900 -noxrecord -noxfixes -noxdamage
autorestart=true
priority=30
startretries=10
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.log

; ── 4. noVNC WebSocket bridge (serves on port 6080) ──────────────────────────
[program:novnc]
command=websockify --web=/opt/novnc 6080 localhost:5900
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.log

; ── 5. Fake Reachy gRPC server (port 50051) ──────────────────────────────────
; Standalone Python server — no ROS required.
; reachy_bringup fake mode is on the physical robot only (separate package).
; This serves the same reachy-sdk-api v1 protocol so notebooks work identically.
; Writes joint positions to /tmp/reachy_joints.json for joint-state-bridge.
[program:reachy-sdk-server]
command=python3 /opt/fake_reachy_server.py
autorestart=true
priority=50
stdout_logfile=/var/log/supervisor/reachy_sdk_server.log
stderr_logfile=/var/log/supervisor/reachy_sdk_server.log

; ── 5b. Joint state bridge (ROS 2 node: reads JSON → /joint_states) ──────────
; Separate process so rclpy runs on main thread without gRPC threading conflicts.
[program:joint-state-bridge]
command=/bin/bash -c "source /opt/ros/foxy/setup.bash && source /opt/reachy_ws/install/setup.bash && python3 /opt/joint_state_bridge.py"
autorestart=true
priority=52
startretries=5
stdout_logfile=/var/log/supervisor/joint_state_bridge.log
stderr_logfile=/var/log/supervisor/joint_state_bridge.log

; ── 6. Robot state publisher (publishes URDF for RViz2 and joint_state_publisher)
; Use --ros-args -p robot_description so the URDF is published to /robot_description
; topic (required by joint_state_publisher). The launch file passes it as a CLI arg
; which only works for TF but skips the topic.
[program:robot-state-publisher]
command=/bin/bash -c "source /opt/ros/foxy/setup.bash && source /opt/reachy_ws/install/setup.bash && URDF=/opt/reachy_ws/install/reachy_description/share/reachy_description/urdf/reachy.URDF && ros2 run robot_state_publisher robot_state_publisher --ros-args -p robot_description:=\"$(cat $URDF)\""
autorestart=true
priority=55
startretries=3
stdout_logfile=/var/log/supervisor/rsp.log
stderr_logfile=/var/log/supervisor/rsp.log

; ── 5c. Camera web server (MJPEG stereo preview on port 8080) ────────────────
[program:camera-web-server]
command=python3 /opt/web/camera_server.py --host 0.0.0.0 --port 8080
autorestart=true
priority=53
stdout_logfile=/var/log/supervisor/camera_web_server.log
stderr_logfile=/var/log/supervisor/camera_web_server.log

; ── 5d. Camera ROS publisher (ROS 2: JPEG files → /reachy_sim/*/image_compressed)
[program:camera-ros-publisher]
command=/bin/bash -c "source /opt/ros/foxy/setup.bash && source /opt/reachy_ws/install/setup.bash && python3 /opt/ros_nodes/camera_publisher.py"
autorestart=true
priority=56
startretries=5
stdout_logfile=/var/log/supervisor/camera_ros_publisher.log
stderr_logfile=/var/log/supervisor/camera_ros_publisher.log

; ── 6b. Scene marker publisher (ROS 2: scene YAML → /reachy_sim/scene/markers)
[program:scene-marker-publisher]
command=/bin/bash -c "source /opt/ros/foxy/setup.bash && source /opt/reachy_ws/install/setup.bash && python3 /opt/ros_nodes/scene_marker_publisher.py --scene ${REACHY_SIM_SCENE_FILE:-/opt/scenes/tabletop_demo.yaml}"
autorestart=true
priority=57
startretries=5
stdout_logfile=/var/log/supervisor/scene_marker_publisher.log
stderr_logfile=/var/log/supervisor/scene_marker_publisher.log

; ── 7. RViz2 on virtual display ───────────────────────────────────────────────
[program:rviz2]
command=/bin/bash -c "source /opt/ros/foxy/setup.bash && source /opt/reachy_ws/install/setup.bash && rviz2 -d /opt/rviz_config/reachy.rviz"
environment=DISPLAY=":1"
autorestart=true
priority=60
startretries=5
stdout_logfile=/var/log/supervisor/rviz2.log
stderr_logfile=/var/log/supervisor/rviz2.log

; ── 8. JupyterLab (port 8888) ─────────────────────────────────────────────────
[program:jupyterlab]
command=jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password='' --notebook-dir=/notebooks
autorestart=true
priority=70
stdout_logfile=/var/log/supervisor/jupyter.log
stderr_logfile=/var/log/supervisor/jupyter.log
