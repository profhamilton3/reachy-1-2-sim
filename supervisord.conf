[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ── 1. Virtual framebuffer ────────────────────────────────────────────────────
[program:xvfb]
command=Xvfb :1 -screen 0 1280x900x24 -ac
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.log

; ── 2. Window manager ─────────────────────────────────────────────────────────
[program:fluxbox]
command=fluxbox
environment=DISPLAY=":1"
autorestart=true
priority=20
startretries=5
stdout_logfile=/var/log/supervisor/fluxbox.log
stderr_logfile=/var/log/supervisor/fluxbox.log

; ── 3. VNC server ─────────────────────────────────────────────────────────────
[program:x11vnc]
command=x11vnc -display :1 -nopw -forever -shared -rfbport 5900 -noxrecord -noxfixes -noxdamage
autorestart=true
priority=30
startretries=10
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.log

; ── 4. noVNC WebSocket bridge (serves on port 6080) ──────────────────────────
[program:novnc]
command=websockify --web=/opt/novnc 6080 localhost:5900
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.log

; ── 5. Fake Reachy gRPC server (port 50051) ──────────────────────────────────
; Standalone Python server — no ROS required.
; reachy_bringup fake mode is on the physical robot only (separate package).
; This serves the same reachy-sdk-api v1 protocol so notebooks work identically.
[program:reachy-sdk-server]
command=python3 /opt/fake_reachy_server.py
autorestart=true
priority=50
stdout_logfile=/var/log/supervisor/reachy_sdk_server.log
stderr_logfile=/var/log/supervisor/reachy_sdk_server.log

; ── 6. Robot state publisher (publishes URDF for RViz2) ──────────────────────
; reachy-description was private — try launching from reachy_sdk_server_2021.
; If this fails, RViz2 will still open but show no robot model.
; Confirm correct launch file with Siva and update command if needed.
[program:robot-state-publisher]
command=/bin/bash -c "source /opt/ros/foxy/setup.bash && source /opt/reachy_ws/install/setup.bash && ros2 launch reachy_bringup reachy_description.launch.py 2>/dev/null || echo 'robot-state-publisher: no description launch found, skipping'"
autorestart=false
priority=55
stdout_logfile=/var/log/supervisor/rsp.log
stderr_logfile=/var/log/supervisor/rsp.log

; ── 7. RViz2 on virtual display ───────────────────────────────────────────────
[program:rviz2]
command=/bin/bash -c "source /opt/ros/foxy/setup.bash && source /opt/reachy_ws/install/setup.bash && rviz2 -d /opt/rviz_config/reachy.rviz"
environment=DISPLAY=":1"
autorestart=true
priority=60
startretries=5
stdout_logfile=/var/log/supervisor/rviz2.log
stderr_logfile=/var/log/supervisor/rviz2.log

; ── 8. JupyterLab (port 8888) ────────────────────────────────────────────────
[program:jupyterlab]
command=jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password='' --notebook-dir=/notebooks
autorestart=true
priority=70
stdout_logfile=/var/log/supervisor/jupyter.log
stderr_logfile=/var/log/supervisor/jupyter.log
